<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monopoly - Menú de Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
</head>
<body>
    <div class="menu-container shadow-lg">
        <div class="monopoly-title">MONOPOLY</div>
        <button class="btn btn-play btn-monopoly btn-lg w-100 mb-3" id="btn-play">Iniciar Juego</button>
        <button class="btn btn-rules btn-monopoly btn-lg w-100 mb-3" id="btn-rules">Reglas</button>
        <button class="btn btn-exit btn-monopoly btn-lg w-100 mb-3" id="btn-exit">Salir</button>
    </div>

    <!-- Modal para reglas -->
    <div class="modal fade" id="rulesModal" tabindex="-1" aria-labelledby="rulesModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="rulesModalLabel">Reglas de Monopoly</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <ul>
                        <li>Cada jugador tira los dados y avanza por el tablero.</li>
                        <li>Compra propiedades, construye casas y hoteles.</li>
                        <li>Cobra alquiler cuando otros caen en tus propiedades.</li>
                        <li>Evita la bancarrota para ganar el juego.</li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/controllers/index.js"></script>
</body>
</html>
