<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Debug Corners - Monopoly</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-info { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Debug Corner Positions - Monopoly</h1>
    
    <button onclick="testCornerElements()">Test Corner Elements</button>
    <button onclick="testBoardMapper()">Test BoardMapper</button>
    <button onclick="simulatePlayerPlacement()">Simulate Player Placement</button>
    
    <div id="results"></div>
    
    <script>
        function testCornerElements() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Testing Corner Elements</h2>';
            
            const cornerPositions = [0, 10, 20, 30]; // GO, Jail, Parking, Go to Jail
            
            cornerPositions.forEach(pos => {
                const element = document.getElementById(`cell-${pos}`);
                const result = document.createElement('div');
                result.className = 'debug-info';
                
                if (element) {
                    result.innerHTML = `
                        <span class="success">✓ Position ${pos}: Element found</span><br>
                        - ID: ${element.id}<br>
                        - Classes: ${element.className}<br>
                        - Has content: ${element.innerHTML ? 'Yes' : 'No'}<br>
                        - Content preview: ${element.innerHTML.substring(0, 100)}...
                    `;
                } else {
                    result.innerHTML = `<span class="error">✗ Position ${pos}: Element NOT found</span>`;
                }
                
                results.appendChild(result);
            });
        }
        
        function testBoardMapper() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Testing BoardMapper</h2>';
            
            if (!window.BoardMapper) {
                results.innerHTML += '<div class="error">BoardMapper not available</div>';
                return;
            }
            
            const cornerPositions = [0, 10, 20, 30];
            
            cornerPositions.forEach(pos => {
                const element = window.BoardMapper.getCellElement(pos);
                const result = document.createElement('div');
                result.className = 'debug-info';
                
                if (element) {
                    result.innerHTML = `
                        <span class="success">✓ BoardMapper Position ${pos}: Element found</span><br>
                        - ID: ${element.id}<br>
                        - Classes: ${element.className}
                    `;
                } else {
                    result.innerHTML = `<span class="error">✗ BoardMapper Position ${pos}: Element NOT found</span>`;
                }
                
                results.appendChild(result);
            });
        }
        
        function simulatePlayerPlacement() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Simulating Player Placement</h2>';
            
            const cornerPositions = [0, 10, 20, 30];
            
            cornerPositions.forEach(pos => {
                const spaceElement = document.getElementById(`cell-${pos}`);
                const result = document.createElement('div');
                result.className = 'debug-info';
                
                if (spaceElement) {
                    // Create a test player piece
                    const testPlayer = document.createElement('div');
                    testPlayer.className = 'test-player';
                    testPlayer.style.cssText = 'width: 20px; height: 20px; background: red; border-radius: 50%; margin: 2px;';
                    testPlayer.textContent = 'T';
                    
                    // Try to place it
                    let playersContainer = spaceElement.querySelector('.players-container');
                    if (!playersContainer) {
                        playersContainer = document.createElement('div');
                        playersContainer.className = 'players-container';
                        playersContainer.style.cssText = 'position: absolute; top: 2px; left: 2px; z-index: 10;';
                        spaceElement.appendChild(playersContainer);
                    }
                    
                    playersContainer.appendChild(testPlayer);
                    
                    result.innerHTML = `
                        <span class="success">✓ Test player placed on position ${pos}</span><br>
                        - Container created: ${playersContainer ? 'Yes' : 'No'}<br>
                        - Space element style: ${spaceElement.style.position || 'default'}
                    `;
                } else {
                    result.innerHTML = `<span class="error">✗ Cannot place test player on position ${pos} - element not found</span>`;
                }
                
                results.appendChild(result);
            });
        }
    </script>
</body>
</html>
