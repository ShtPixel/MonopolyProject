<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
</head>
<body>
    <div class="menu-container">
        <h2 class="text-white mb-4">Registro de Jugadores</h2>
        <div class="players-container">
            <!-- Jugador 1 -->
            <div class="player-form mb-4">
                <h4 class="text-white">Jugador 1</h4>
                <form id="loginForm1" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="username1" class="form-label text-white">Nombre:</label>
                        <input type="text" id="username1" class="form-control" required>
                        <div class="invalid-feedback">
                            Por favor ingrsar un nombre valido
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="country1" class="form-label text-white">Pais:</label>
                        <select id="country1" class="form-select" required>
                            <!-- Options will be populated by JavaScript -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Color:</label>
                        <div class="color-options">
                            <input type="radio" name="color1" id="red1" value="red" class="color-radio" required>
                            <label for="red1" class="color-label red"></label>
                            
                            <input type="radio" name="color1" id="blue1" value="blue" class="color-radio" required>
                            <label for="blue1" class="color-label blue"></label>
                            
                            <input type="radio" name="color1" id="green1" value="green" class="color-radio" required>
                            <label for="green1" class="color-label green"></label>
                            
                            <input type="radio" name="color1" id="yellow1" value="yellow" class="color-radio" required>
                            <label for="yellow1" class="color-label yellow"></label>
                        </div>
                    </div>
                </form>
            </div>

                        </div>
                    </div>

        <div class="mt-4">
            <button type="button" id="startGame" class="btn btn-play btn-monopoly btn-lg w-100" disabled>
                Iniciar Juego
            </button>
            <button type="button" class="btn btn-exit btn-monopoly btn-lg w-100 mt-3" onclick="window.location.href='../../index.html'">
                Volver al Inicio
            </button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../controllers/login.js"></script>
