    <title>Monopoly - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png">

<body>
    <div class="menu-container">
        <h2 class="text-white mb-3">Registro de Jugadores</h2>
        <div class="players-container">
            <!-- Jugador 1 -->
            <div class="player-form mb-4">
                <h4 class="text-white">Jugador 1</h4>
                <form id="loginForm1" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="username1" class="form-label text-white">Nombre:</label>
                        <input type="text" id="username1" class="form-control" required>
                        <div class="invalid-feedback">
                            Por favor ingrsar un nombre valido
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="country1" class="form-label text-white">Pais:</label>
                        <select id="country1" class="form-select" required>
                            <!-- Options will be populated by JavaScript -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="color1" class="form-label text-white">Color:</label>
                        <select id="color1" class="form-select" required>
                            <option value="" disabled selected>Elegir Color</option>
                            <option value="red">Rojo</option>
                            <option value="blue">Azul</option>
                            <option value="green">Verde</option>
                            <option value="yellow">Amarillo</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="token1" class="form-label text-white">Ficha:</label>
                        <select id="token1" class="form-select" required>
                            <option value="" disabled selected>Elegir Ficha</option>
                            <option value="car">Auto</option>
                            <option value="hat">Sombrero</option>
                            <option value="dog">Perro</option>
                            <option value="ship">Bote</option>
                        </select>
                    </div>
                </form>
            </div>
