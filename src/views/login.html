<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
</head>
<body>
    <div class="menu-container">
        <h2 class="text-white mb-4">Inicio</h2>
        <form id="loginForm" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label text-white">Nombre:</label>
                <input type="text" id="username" class="form-control" required>
                <div class="invalid-feedback">
                    Por favor ingrsar un nombre valido
                </div>
            </div>
            <div class="mb-3">
                <label for="country" class="form-label text-white">Pais:</label>
                <select id="country" class="form-select" required>
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <div class="mb-3">
                <label for="color" class="form-label text-white">Color:</label>
                <select id="color" class="form-select" required>
                    <option value="" disabled selected>Elegir Color</option>
                    <option value="red">Rojo</option>
                    <option value="blue">Azul</option>
                    <option value="green">Verde</option>
                    <option value="yellow">Amarillo</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="token" class="form-label text-white">Ficha:</label>
                <select id="token" class="form-select" required>
                    <option value="" disabled selected>Elegir Ficha</option>
                    <option value="car">Auto</option>
                    <option value="hat">Sombrero</option>
                    <option value="dog">Perro</option>
                    <option value="ship">Bote</option>
                </select>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-play btn-monopoly btn-lg w-100">
                    Iniciar Juego
                </button>
                <button type="button" class="btn btn-exit btn-monopoly btn-lg w-100 mt-3" onclick="window.location.href='../../index.html'">
                    Volver al Inicio
                </button>
            </div>
        </form>
        <div id="error-container"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../controllers/login.js"></script>
</body>
</html>
