<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monopoly - Ranking</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/ranking.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png" />
    <script src="../controllers/ranking.js" defer></script>
  </head>
  <body>
    <div class="menu-container">
      <h2 class="ranking-title mb-4">Ranking de Jugadores</h2>
      <div id="rankingContainer">
        <div class="table-responsive">
          <table class="table ranking-table align-middle mb-0">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Jugador</th>
                <th scope="col">Puntaje</th>
                <th scope="col">País</th>
                <th scope="col">Bandera</th>
              </tr>
            </thead>
            <tbody id="rankingBody">
              <!-- Filas generadas por JS -->
            </tbody>
          </table>
        </div>
        <div class="mt-4 d-flex flex-column gap-3">
          <button
            type="button"
            class="btn btn-monopoly btn-lg w-100"
            onclick="window.location.href='../../index.html'"
          >
            Volver al Inicio
          </button>
          <button
            type="button"
            class="btn btn-monopoly btn-lg w-100"
            onclick="window.location.href='board.html'"
          >
            Ir al Tablero
          </button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
