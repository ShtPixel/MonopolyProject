<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monopoly - Dados</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .hud {
      background: #fff;
      padding: 2em;
      margin-top: 3em;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .dice-container {
      display: flex;
      justify-content: center;
      gap: 2em;
      margin: 1em 0;
    }
    .die {
      width: 60px;
      height: 60px;
      background: #e0e0e0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5em;
      font-weight: bold;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .btn {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 0.7em 1.5em;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 1em;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0056b3;
    }
    .input {
      margin-top: 1em;
      padding: 0.5em;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 120px;
      text-align: center;
      font-size: 1em;
    }
    .link-container {
      margin-top: 2em;
    }
    #sumLabel {
      display: block;
      margin-top: 1em;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <!-- Interfaz de lanzamiento de dados -->
  <div class="hud">
    <h2>Lanzar Dados</h2>
    <div class="dice-container">
      <div id="die1" class="die">?</div>
      <div id="die2" class="die">?</div>
    </div>
    <button id="rollBtn" class="btn">Lanzar dados</button>
    <input id="debugDice" class="input" placeholder="Debug: 3,4" />
    <strong id="sumLabel">Suma: 0</strong>
  </div>

  <!-- Enlace de regreso al tablero -->
  <div class="link-container">
    <a href="../views/board.html" class="btn">Ir al Tablero</a>
  </div>

  <script>
    const die1 = document.getElementById('die1');
    const die2 = document.getElementById('die2');
    const rollBtn = document.getElementById('rollBtn');
    const debugDice = document.getElementById('debugDice');
    const sumLabel = document.getElementById('sumLabel');

    function rollDice() {
      let val1, val2;
      const debug = debugDice.value.trim();
      if (debug) {
        // Permite ingresar valores como "3,4"
        const parts = debug.split(',').map(x => parseInt(x, 10));
        if (
          parts.length === 2 &&
          parts.every(n => Number.isInteger(n) && n >= 1 && n <= 6)
        ) {
          val1 = parts[0];
          val2 = parts[1];
        } else {
          alert('Ingrese dos números entre 1 y 6, separados por coma.');
          return;
        }
      } else {
        val1 = Math.floor(Math.random() * 6) + 1;
        val2 = Math.floor(Math.random() * 6) + 1;
      }
      die1.textContent = val1;
      die2.textContent = val2;
      sumLabel.textContent = 'Suma: ' + (val1 + val2);
      // Aquí puedes agregar la lógica para mover la ficha del jugador según la suma
    }

    rollBtn.addEventListener('click', rollDice);
    debugDice.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') rollDice();
    });
  </script>
</body>
</html>
