<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Monopoly - Tablero</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/board.css" />
    <link rel="stylesheet" href="../styles/dados.css" />
    <link rel="stylesheet" href="../styles/common.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/ranking.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg monopoly-navbar shadow fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold text-light" href="../../index.html">
          MONOPOLY
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarTogglerDemo01"
          aria-controls="navbarTogglerDemo01"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link fw-semibold text-light" href="ranking.html"
                >Ranking</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link fw-semibold text-light" href="#"
                >Finalizar Juego</a
              >
            </li>
          </ul>
          <!-- Dados en la navbar -->
          <div class="navbar-dice ms-auto d-flex align-items-center gap-3">
            <!-- Dados con SVG -->
            <div id="die1" class="die-svg"></div>
            <div id="die2" class="die-svg"></div>
            <button id="rollDiceButton" class="btn btn-monopoly">
              Lanzar Dados
            </button>
            <input
              id="debugDice"
              type="number"
              min="1"
              max="40"
              step="1"
              placeholder="manual"
              class="form-control debug-dice-input"
            />
            <span id="sumLabel" class="fw-bold sum-label">Suma: 0</span>
          </div>
        </div>
      </div>
    </nav>
    <!-- Resto del tablero -->
    <div class="board-container">
      <div class="board" id="board"></div>
    </div>
    <script src="../controllers/dados.js" defer></script>
    <script src="../controllers/board.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
