<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Monopoly - Tablero</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/board.css" />
    <link rel="stylesheet" href="../styles/dados.css" />
    <link rel="stylesheet" href="../styles/common.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/ranking.css" />
    <link rel="stylesheet" href="../styles/properties-modal.css" />
    <link rel="stylesheet" href="../styles/player.css" />
    <link rel="stylesheet" href="../styles/game-panel.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../../assets/images/favicon.png" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg monopoly-navbar shadow fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold text-light" href="../../index.html">
          MONOPOLY
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarTogglerDemo01"
          aria-controls="navbarTogglerDemo01"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link fw-semibold text-light" href="ranking.html"
                >Ranking</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold text-light"
                href="#"
                id="endGameButton"
                >Finalizar Juego</a
              >
            </li>
          </ul>
          <!-- Dados en la navbar -->
          <div class="navbar-dice ms-auto d-flex align-items-center gap-3">
            <!-- Dados con SVG -->
            <div id="die1" class="die-svg"></div>
            <div id="die2" class="die-svg"></div>
            <button id="rollDiceButton" class="btn btn-monopoly">
              Lanzar Dados
            </button>
            <input
              id="debugDice"
              type="number"
              min="1"
              max="40"
              step="1"
              placeholder="manual"
              class="form-control debug-dice-input"
            />
            <span id="sumLabel" class="fw-bold sum-label">Suma: 0</span>
          </div>
        </div>
      </div>
    </nav>
    <!-- Resto del tablero -->
    <div class="board-container">
      <div class="board" id="board"></div>
    </div>

    <!-- Modal de confirmación para finalizar juego -->
    <div
      class="modal fade"
      id="endGameConfirmModal"
      tabindex="-1"
      aria-labelledby="endGameConfirmModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="endGameConfirmModalLabel">
              Finalizar Juego
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p>¿Estás seguro de que quieres finalizar el juego?</p>
            <p class="text-muted">
              Se mostrarán las estadísticas finales de todos los jugadores.
            </p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="button" class="btn btn-danger" id="confirmEndGame">
              Finalizar Juego
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de estadísticas finales -->
    <div
      class="modal fade"
      id="gameStatsModal"
      tabindex="-1"
      aria-labelledby="gameStatsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="gameStatsModalLabel">
              📊 Estadísticas Finales del Juego
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div id="gameStatsContent">
              <!-- Aquí se insertarán las estadísticas -->
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              onclick="window.location.href='../../index.html'"
            >
              Volver al Menú Principal
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="window.location.href='ranking.html'"
            >
              Ver Ranking Global
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de propiedades del jugador -->
    <div
      class="modal fade"
      id="playerPropertiesModal"
      tabindex="-1"
      aria-labelledby="playerPropertiesModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="playerPropertiesModalLabel">
              🏠 Propiedades del Jugador
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body player-properties-modal">
            <div id="playerPropertiesContent">
              <!-- Aquí se insertará el contenido de las propiedades -->
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../controllers/boardMapper.js"></script>
    <script src="../controllers/player.js"></script>
    <script src="../controllers/board.js"></script>
    <script src="../controllers/game.js"></script>
    <script src="../controllers/dados.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
